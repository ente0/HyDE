# Raspberry Pi 5 tuning for HyDE / Hyprland.
# Sourced from hyprland.conf; overrides the heavier defaults in themes/theme.conf
# and elsewhere. Safe to delete on non-Pi hardware.

# ── Renderer / DRM device ────────────────────────────────────────────────
# Pi 5 exposes two DRM nodes: card0 is vc4 (display-only, no GL),
# card1 is v3d (the actual 3D renderer). Aquamarine picks the wrong one
# by default → "Can't create renderer, no matching devices found".
env = AQ_DRM_DEVICES,/dev/dri/card1
env = WLR_RENDERER,gles2
env = WLR_NO_HARDWARE_CURSORS,1   # vc4 cursor planes are flaky
env = LIBSEAT_BACKEND,logind

# ── Decorations: kill the expensive ones ─────────────────────────────────
# 3-pass blur on V3D ES is ~30% of frame budget by itself.
decoration {
    rounding = 6
    shadow:enabled = false

    blur {
        enabled = false
    }
}

# Disable the wallbash screen shader (runs every frame).
decoration:screen_shader =

# ── Animations: keep but trim ────────────────────────────────────────────
animations {
    enabled = yes
    bezier  = pi5, 0.25, 0.1, 0.25, 1.0
    animation = windows,     1, 3, pi5
    animation = windowsOut,  1, 3, pi5, popin 80%
    animation = border,      0
    animation = borderangle, 0
    animation = fade,        1, 3, pi5
    animation = workspaces,  1, 3, pi5
}

# ── Misc ─────────────────────────────────────────────────────────────────
misc {
    vfr = true                      # cut GPU load when nothing moves
    vrr = 0                         # vc4 doesn't do VRR
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── Layer rules: drop the waybar blur ────────────────────────────────────
layerrule = unset,waybar

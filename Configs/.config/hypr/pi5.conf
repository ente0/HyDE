# Raspberry Pi 5 tuning for HyDE / Hyprland.
# Sourced from hyprland.conf. Safe to delete on non-Pi hardware.
#
# Note: renderer env vars (AQ_DRM_DEVICES, WLR_*, GBM_BACKEND) are NOT here.
# Hyprland's `env =` directive is applied after the renderer initialises, so
# anything related to GPU/DRM device selection must be exported before
# Hyprland starts. See: Configs/.config/uwsm/env-hyprland.d/01-pi5.sh

# ── Decorations: kill the expensive ones ─────────────────────────────────
# 3-pass blur on V3D ES is ~30% of the frame budget by itself.
decoration {
    rounding = 6
    shadow:enabled = false

    blur {
        enabled = false
    }
}

# Disable the wallbash screen shader (runs every frame).
decoration:screen_shader =

# ── Animations: keep but trim ────────────────────────────────────────────
animations {
    enabled = yes
    bezier  = pi5, 0.25, 0.1, 0.25, 1.0
    animation = windows,     1, 3, pi5
    animation = windowsOut,  1, 3, pi5, popin 80%
    animation = border,      0
    animation = borderangle, 0
    animation = fade,        1, 3, pi5
    animation = workspaces,  1, 3, pi5
}

# ── Misc ─────────────────────────────────────────────────────────────────
misc {
    vfr = true                      # drop GPU load when nothing moves
    vrr = 0                         # vc4 doesn't do VRR
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── Layer rules: drop the waybar blur ────────────────────────────────────
layerrule = unset,waybar
